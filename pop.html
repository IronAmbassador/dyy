<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        .container {
            position: relative;
            width: 465px;
            height: 536px;
            border: 2px solid #ccc;
            overflow: hidden;
        }
        .book-img {
            width: 100%;
            height: 100%;
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(100, 149, 237, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .container:hover .overlay {
            opacity: 1;
        }
        .copyright {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=C%20language%20programming%20tutorial%20book%20cover%20with%20CD%20disc%203D%20render%20white%20background&image_size=portrait_4_3" 
             alt="C语言开发入门教程" class="book-img">
        <div class="overlay">
            <div class="copyright">版权所有：20240000 张三</div>
        </div>
    </div>
</body>
</html>
